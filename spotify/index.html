<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://volibot.is-a.bot/spotify/">
  <title>Spotify Auto Like</title>
</head>
<body>
  <main>
    <h1>Spotify Auto Like</h1>
    <p id="status">앱으로 돌아가는 중입니다.</p>
    <p><a id="openApp" href="spotifyautolike://callback">앱 열기</a></p>
  </main>
  <script>
    (function () {
      const target = "spotifyautolike://callback" + window.location.search + window.location.hash;
      const link = document.getElementById("openApp");
      link.href = target;
      if (window.location.search || window.location.hash) {
        window.location.replace(target);
      } else {
        document.getElementById("status").textContent = "Spotify Auto Like 인증 콜백 페이지입니다.";
      }
    })();
  </script>
</body>
</html>
