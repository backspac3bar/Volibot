name: Register Volibot LoL emojis

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: volibot-lol-emoji-registration
  cancel-in-progress: false

jobs:
  register-emojis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate registration script
        run: node --test test/register-lol-emojis.test.mjs
      - name: Register champions and ranked tiers on the verified Volibot application
        run: node scripts/register-lol-emojis.mjs
